# Last modified on:  2026-11-14
#
# Packages kds-evals: cases, metrics, a runner and reports, a judge.

[project]
name = "kds-evals"
version = "0.8.1"
description = "Evaluation cases, metrics, a runner that writes results tables, a model judge with calibration, run comparison, and a span per case."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Kevin Street", email = "info@kevindstreet.com" }]
dependencies = [
  "kds-args>=0.8,<0.9",
  "kds-llm>=0.8,<0.9",
  "kds-logs>=0.8,<0.9",
  "opentelemetry-api>=1.45,<2",
  "opentelemetry-sdk>=1.45,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.17"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kds.evals"]

[tool.setuptools.package-data]
"kds.evals" = ["py.typed"]
