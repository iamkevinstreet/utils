########################################################################
#                          llm/pyproject.toml                          #
########################################################################
#  Author:            Kevin Street                                     #
#  Created on:        2026-10-14                                       #
#  Last modified on:  2026-10-29                                       #
#  Purpose:           Packages kds-llm: one model adapter with         #
#                     retries, JSON, cost and budget.                  #
########################################################################
[project]
name = "kds-llm"
version = "0.3.0"
description = "One model adapter for Anthropic, OpenAI and Azure OpenAI, with an offline stand-in, retries, structured output, cost accounting and a budget stop."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Kevin Street", email = "info@kevindstreet.com" }]
dependencies = [
  "kds-settings>=0.3,<0.4",
  "kds-logs>=0.3,<0.4",
  "anthropic>=0.40",
  "openai>=1.50",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.17"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kds.llm"]

[tool.setuptools.package-data]
"kds.llm" = ["pricing.json", "py.typed"]
