# Author:            Kevin Street
# Created on:        2026-10-14
# Last modified on:  2026-11-10
#
# Packages kds-llm: one model adapter with retries, JSON, cost and
# budget.

[project]
name = "kds-llm"
version = "0.8.0"
description = "One model adapter for Anthropic, OpenAI and Azure OpenAI, with an offline stand-in, retries, structured output, cost accounting, a budget stop, and OpenTelemetry GenAI spans."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Kevin Street", email = "info@kevindstreet.com" }]
dependencies = [
  "kds-args>=0.8,<0.9",
  "kds-settings>=0.8,<0.9",
  "kds-logs>=0.8,<0.9",
  "anthropic>=1.14",
  "openai>=1.50",
  "httpx>=0.27",
  "opentelemetry-api>=1.45,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.17"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kds.llm"]

[tool.setuptools.package-data]
"kds.llm" = ["pricing.json", "py.typed"]
