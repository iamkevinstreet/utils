[project]
name = "kds-llm"
version = "0.1.0"
description = "One model adapter for Anthropic, OpenAI and Azure OpenAI, with an offline stand-in, retries, structured output, cost accounting and a budget stop."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Kevin Street", email = "info@kevindstreet.com" }]
dependencies = [
  "kds-settings @ git+https://github.com/iamkevinstreet/utils.git@main#subdirectory=settings",
  "kds-logs @ git+https://github.com/iamkevinstreet/utils.git@main#subdirectory=logs",
  "anthropic>=0.40",
  "openai>=1.50",
  "httpx>=0.27"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kds.llm"]

[tool.setuptools.package-data]
"kds.llm" = ["pricing.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
