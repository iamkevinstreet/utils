########################################################################
#                       standards/pyproject.toml                       #
########################################################################
#  Author:            Kevin Street                                     #
#  Created on:        2026-10-29                                       #
#  Last modified on:  2026-10-29                                       #
#  Purpose:           Packages kds-standards, the command that checks  #
#                     a repository against one code standard.          #
########################################################################
[project]
name = "kds-standards"
version = "0.3.0"
description = "Checks a repository against one code standard: headers, logger lines, size, layout, published docs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Kevin Street", email = "info@kevindstreet.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.17"]

[project.scripts]
kds-standards = "kds.standards.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kds.standards"]

[tool.setuptools.package-data]
"kds.standards" = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
