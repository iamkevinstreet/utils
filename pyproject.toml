########################################################################
#                            pyproject.toml                            #
########################################################################
#  Author:            Kevin Street                                     #
#  Created on:        2026-10-14                                       #
#  Last modified on:  2026-10-29                                       #
#  Purpose:           Repository-wide tool settings: ruff, mypy and    #
#                     pytest, set to one code standard across every    #
#                     package.                                         #
########################################################################
# Each package folder has its own installable pyproject.toml; these settings apply to all.
[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "BLE", "S", "C90", "PL", "RUF", "G", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8
max-positional-args = 5

[tool.ruff.lint.isort]
known-first-party = ["kds"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004", "D"]

# Tests run from the repository root, so the package folders merge into one `kds` namespace.
[tool.pytest.ini_options]
pythonpath = ["settings", "logs", "llm", "evals", "synthetic", "standards", "diagrams"]
testpaths = [
  "settings/tests",
  "logs/tests",
  "llm/tests",
  "evals/tests",
  "synthetic/tests",
  "standards/tests",
  "diagrams/tests",
  "tests",
]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "settings:logs:llm:evals:synthetic:standards:diagrams"
