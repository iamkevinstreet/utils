########################################################################
#                       synthetic/pyproject.toml                       #
########################################################################
# Author:            Kevin Street
# Created on:        2026-10-14
# Last modified on:  2026-10-29
#
# Packages kds-synthetic: made-up names and PDFs that record their text.

[project]
name = "kds-synthetic"
version = "0.4.2"
description = "Made-up names with near-duplicate variants, and a PDF builder that records page text for span checks."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Kevin Street", email = "info@kevindstreet.com" }]
dependencies = [
  "kds-args>=0.4,<0.5",
  "reportlab>=4.2",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.17"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kds.synthetic"]

[tool.setuptools.package-data]
"kds.synthetic" = ["py.typed"]
