name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: fake
      LLM_MODEL: fake-model
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets scan (whole history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --exit-code 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip ruff pytest pytest-asyncio
          pip install pydantic pydantic-settings anthropic openai httpx reportlab pypdf

      - name: Install check (each folder builds and installs as its own package)
        run: |
          pip install ./settings ./logs ./llm ./evals ./synthetic
          python -c "import kds.settings, kds.logs, kds.llm, kds.evals, kds.synthetic; print('all five import')"

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Tests
        run: pytest
