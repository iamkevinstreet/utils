# Author:            Kevin Street
# Created on:        2026-10-29
# Last modified on:  2026-11-05
#
# Weekly pull requests that update the pinned Actions and the locked
# Python dependencies, each kind's updates grouped into one pull request,
# which the dependency-updates workflow lands once CI passes.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
