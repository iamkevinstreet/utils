# Author:            Kevin Street
# Created on:        2026-10-29
# Last modified on:  2026-10-29
#
# Weekly pull requests that update the pinned Actions and the locked
# Python dependencies.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
