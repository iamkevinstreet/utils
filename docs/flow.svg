<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">How a project uses the workshop</title><desc id="desc">Pick the tools, pin one commit, and every project runs, logs and is checked the same way.</desc><defs><marker id="plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a3a3a3"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b8def"/></marker></defs><rect width="100%" height="100%" fill="#121212"/><text x="28" y="64" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" fill="#f2f2f2" font-size="44">How a project uses the workshop</text><text x="28" y="100" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="16" font-weight="700">Pick the tools, pin one commit, and every project runs, logs and is checked the same way.</text><text x="28" y="122" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">Steps in reading order. Blue: the step that brings the tools in.</text><rect x="28" y="160" width="272" height="80" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="164" y="184" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">1. Pick the tools</text><text x="42" y="204" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">only what the project needs</text><text x="42" y="221" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">each tool is its own package</text><rect x="364" y="160" width="272" height="80" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="500" y="184" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">2. Pin one commit</text><text x="378" y="204" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">from git at one commit, not PyPI</text><text x="378" y="221" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">locked with hashes</text><rect x="700" y="160" width="272" height="80" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="836" y="184" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">3. Configure</text><text x="714" y="204" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">settings.toml, then .env secrets</text><text x="714" y="221" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">validated once, then frozen</text><rect x="28" y="300" width="272" height="80" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="164" y="324" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">4. Use the tools</text><text x="42" y="344" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">in the project&#x27;s own code</text><text x="42" y="361" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">each tool&#x27;s README says how</text><rect x="364" y="300" width="272" height="80" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="500" y="324" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">5. Log every event</text><text x="378" y="344" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">one JSON line, one request id</text><text x="378" y="361" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">personal data redacted</text><rect x="700" y="300" width="272" height="80" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="836" y="324" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">6. Test and check</text><text x="714" y="344" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">offline stand-ins, seeded data</text><text x="714" y="361" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">kds-standards on every commit</text><path d="M300 200 L364 200" fill="none" stroke="#5b8def" stroke-width="2" marker-end="url(#accent)"/><path d="M636 200 L700 200" fill="none" stroke="#a3a3a3" stroke-width="1.2" marker-end="url(#plain)"/><path d="M836 240 L836 270 L164 270 L164 300" fill="none" stroke="#a3a3a3" stroke-width="1.2" marker-end="url(#plain)"/><path d="M300 340 L364 340" fill="none" stroke="#a3a3a3" stroke-width="1.2" marker-end="url(#plain)"/><path d="M636 340 L700 340" fill="none" stroke="#a3a3a3" stroke-width="1.2" marker-end="url(#plain)"/><rect x="28" y="440" width="944" height="80" rx="8" fill="#202020" stroke="#3d3d3d" stroke-width="1"/><text x="42" y="466" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">Every project gets</text><text x="42" y="488" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">the same settings and logs, so runs compare across projects</text><text x="42" y="505" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">one code standard and the same README diagrams, in every repository</text></svg>
