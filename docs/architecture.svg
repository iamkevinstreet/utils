<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">utils at a glance</title><desc id="desc">Tools collected over time; each project takes only what it needs.</desc><defs><marker id="plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a3a3a3"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b8def"/></marker></defs><rect width="100%" height="100%" fill="#121212"/><text x="28" y="64" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" fill="#f2f2f2" font-size="44">utils at a glance</text><text x="28" y="100" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="16" font-weight="700">Tools collected over time; each project takes only what it needs.</text><text x="28" y="122" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">Grey arrows: depends on. Blue: how a tool reaches a project, pinned to one commit. Dashed boxes: who uses what.</text><rect x="28" y="270" width="944" height="160" rx="8" fill="none" stroke="#4a4a4a" stroke-width="1" stroke-dasharray="5 4"/><text x="42" y="294" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">Runtime · imported by a project&#x27;s code</text><rect x="28" y="450" width="300" height="140" rx="8" fill="none" stroke="#4a4a4a" stroke-width="1" stroke-dasharray="5 4"/><text x="42" y="474" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">Test data · when a test needs it</text><rect x="350" y="450" width="622" height="140" rx="8" fill="none" stroke="#4a4a4a" stroke-width="1" stroke-dasharray="5 4"/><text x="364" y="474" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">Developer tools · for any repository, never shipped to users</text><rect x="28" y="150" width="380" height="70" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="218" y="174" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">Any project</text><text x="218" y="194" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">takes only the tools it needs</text><rect x="592" y="150" width="380" height="70" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="782" y="174" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">This repository</text><text x="606" y="194" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">on GitHub, never PyPI</text><text x="606" y="211" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">each release names one commit</text><rect x="48" y="312" width="208" height="96" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="152" y="336" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">settings</text><text x="62" y="356" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">settings.toml + .env</text><text x="62" y="373" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">typed, frozen</text><text x="62" y="390" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">secrets masked</text><rect x="280" y="312" width="208" height="96" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="384" y="336" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">logs</text><text x="294" y="356" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">one JSON line per event</text><text x="294" y="373" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">request ids</text><text x="294" y="390" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">redaction, traces</text><rect x="512" y="312" width="208" height="96" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="616" y="336" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">llm</text><text x="526" y="356" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">one interface for</text><text x="526" y="373" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">model providers</text><text x="526" y="390" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">see its README</text><rect x="744" y="312" width="208" height="96" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="848" y="336" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">evals</text><text x="758" y="356" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">cases and metrics</text><text x="758" y="373" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">runner and reports</text><rect x="48" y="488" width="260" height="86" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="178" y="512" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">synthetic</text><text x="62" y="532" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">made-up names, near duplicates</text><text x="62" y="549" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">PDFs that record page text</text><rect x="370" y="488" width="280" height="86" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="510" y="512" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">standards</text><text x="384" y="532" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">kds-standards check</text><text x="384" y="549" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">headers, logger lines, layout, docs</text><rect x="672" y="488" width="280" height="86" rx="8" fill="#1b1b1b" stroke="#3d3d3d" stroke-width="1"/><text x="812" y="512" text-anchor="middle" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#f2f2f2" font-size="14" font-weight="700">diagrams</text><text x="686" y="532" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill="#a3a3a3" font-size="12.5">these README diagrams</text><text x="686" y="549" font-family="-apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" fill=