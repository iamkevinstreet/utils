[[diagram]]
file = "flow.svg"
width = 1000
height = 560
title = "How a model call works"
subtitle = "Every call is budgeted, retried with care, validated, priced and logged."
caption = "Steps in reading order. Blue: the request that leaves your environment."

[[diagram.component]]
box = [28, 160, 272, 80]
name = "1. Load settings"
details = ["settings.toml, then .env secrets", "validated once, then frozen"]

[[diagram.component]]
box = [364, 160, 272, 80]
name = "2. Open a request id"
details = ["every log line carries it", "one per evaluation case"]

[[diagram.component]]
box = [700, 160, 272, 80]
name = "3. Check the budget"
details = ["refuse once spend passes it", "eval_budget_usd"]

[[diagram.component]]
box = [28, 300, 272, 80]
name = "4. Call the provider"
details = ["retry 408, 409, 429, 5xx only", "jittered backoff, capped"]

[[diagram.component]]
box = [364, 300, 272, 80]
name = "5. Validate the JSON"
details = ["parse against the schema", "one repair turn, then fail"]

[[diagram.component]]
box = [700, 300, 272, 80]
name = "6. Price and log"
details = ["tokens, latency, cost", "at the dated list price"]

