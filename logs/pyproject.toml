########################################################################
#  Author:            Kevin Street                                     #
#  Created on:        2026-10-14                                       #
#  Last modified on:  2026-10-29                                       #
#  Purpose:           Packages kds-logs: JSON-lines logs with request  #
#                     ids, redaction and traces.                       #
########################################################################
[project]
name = "kds-logs"
version = "0.3.0"
description = "JSON-lines logging with request ids, redaction of personal data, and HH:MM:SS trace lines."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Kevin Street", email = "info@kevindstreet.com" }]
dependencies = [
  "kds-settings>=0.3,<0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.17"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kds.logs"]

[tool.setuptools.package-data]
"kds.logs" = ["py.typed"]
