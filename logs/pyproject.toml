# Author:            Kevin Street
# Created on:        2026-10-14
# Last modified on:  2026-11-14
#
# Packages kds-logs: JSON-lines logs with request ids, redaction and
# traces, and OpenTelemetry spans.

[project]
name = "kds-logs"
version = "0.8.1"
description = "JSON-lines logging with request ids, redaction of personal data, HH:MM:SS trace lines, and OpenTelemetry spans for Langfuse or any tracing tool."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Kevin Street", email = "info@kevindstreet.com" }]
dependencies = [
  "kds-args>=0.8,<0.9",
  "kds-settings>=0.8,<0.9",
  "opentelemetry-api>=1.45,<2",
  "opentelemetry-sdk>=1.45,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.17"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kds.logs"]

[tool.setuptools.package-data]
"kds.logs" = ["py.typed"]
