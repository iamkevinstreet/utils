########################################################################
#                                                                      #
#                              copier.yml                              #
#                                                                      #
########################################################################
# Author:            Kevin Street
# Created on:        2026-11-09
# Last modified on:  2026-11-09
#
# The project template. `copier copy` starts a project from template/
# with the same layers, settings, command, checks and CI as every
# other, its packages from this repository pinned to the commit it was
# copied from; `copier update` brings a project to a later release.
# Copy from GitHub, never a local clone, so the answers file a project
# commits names its source by URL.

_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml
_min_copier_version: "9.4"
# Files a project makes its own once written, which an update leaves as they are.
_skip_if_exists:
  - README.md
  - CHANGELOG.md
  - SECURITY.md
  - config/config.toml
  - pipelines/__main__.py
  - pipelines/config.py
_message_after_copy: |
  {{ project_name }} is ready. From its folder:

      git init -b main
      uv lock
      make install
      make stamp
      git add -A
      git commit -m "Start from the utils project template"
      make check test build docs

  Then create {{ repo }} on GitHub, push main, and add the first source: its README says how.

project_name:
  type: str
  help: The project's name, as its README's title shows it
  validator: "{% if not project_name.strip() %}A name is required{% endif %}"

repo:
  type: str
  help: The repository's name on GitHub
  default: >-
    {{ project_name | lower | regex_replace('[^a-z0-9]+', '-') | regex_replace('^-+|-+$', '') }}
  validator: >-
    {% if not repo | regex_search('^[a-z0-9][a-z0-9-]*$') %}
    Lower-case letters, digits and hyphens only, starting with a letter or a digit
    {% endif %}

description:
  type: str
  help: What the project does, in a sentence or two, for its README and its package
  validator: >-
    {% if not description.strip() %}
    A description is required
    {% elif '"' in description or '\\' in description %}
    No double quotes or backslashes: the description is written into pyproject.toml
    {% endif %}

industry:
  type: str
  help: The industry the project serves
  choices:
    Legal: legal
    Healthcare: healthcare
    Insurance: insurance
    Manufacturing: manufacturing
    Retail: retail
    Tech: tech
    Consulting: consulting
    Any business: any
  default: any

utils_commit:
  type: str
  help: The commit of this repository the project's packages are pinned to
  default: "{{ _copier_conf.vcs_ref_hash }}"
  validator: >-
    {% if not utils_commit | regex_search('^[0-9a-f]{40}$') %}
    A full 40-character commit SHA, never a branch or a short SHA
    {% endif %}
