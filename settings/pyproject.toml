#  Purpose:           Packages kds-settings: typed settings from       #
#                     settings.toml and .env.                          #
########################################################################
[project]
name = "kds-settings"
version = "0.3.0"
description = "Typed, read-only settings: values from config/settings.toml, secrets from .env, masked in logs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Kevin Street", email = "info@kevindstreet.com" }]
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.17"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kds.settings"]

[tool.setuptools.package-data]
"kds.settings" = ["py.typed"]
